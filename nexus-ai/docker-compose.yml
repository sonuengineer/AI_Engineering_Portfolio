name: nexus

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: nexus-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    ports:
      - "5441:5432"
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    container_name: nexus-api
    profiles: ["full"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus_local_only}@db:5432/${POSTGRES_DB:-nexus}
      INGESTION_MODE: worker
      CORS_ORIGINS: http://localhost:8081
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8101 --proxy-headers"]
    volumes:
      - nexus_objects:/data/objects
    ports:
      - "8101:8101"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    container_name: nexus-worker
    profiles: ["full"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus_local_only}@db:5432/${POSTGRES_DB:-nexus}
    command: ["python", "-m", "app.worker"]
    healthcheck:
      # the worker serves no HTTP; healthy if its process is alive
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if any(b'app.worker' in open(f'/proc/{p}/cmdline','rb').read() for p in os.listdir('/proc') if p.isdigit()) else 1)"]
      interval: 30s
    volumes:
      - nexus_objects:/data/objects
    depends_on:
      api:
        condition: service_started

  web:
    build: ./frontend
    container_name: nexus-web
    profiles: ["full"]
    ports:
      - "8081:80"
    depends_on:
      - api

  # Optional S3-compatible object storage (SeaweedFS S3 gateway): docker compose --profile s3 up -d object-store
  # Then set STORAGE_BACKEND=s3 and S3_ENDPOINT_URL=http://localhost:9010 (http://object-store:8333 inside
  # compose). The app creates the bucket on startup. (MinIO no longer publishes free container images.)
  object-store:
    image: chrislusf/seaweedfs:4.48
    container_name: nexus-object-store
    profiles: ["s3"]
    command: ["mini", "-dir=/data"]
    ports:
      - "9010:8333"
    volumes:
      - nexus_s3:/data

volumes:
  nexus_pgdata:
  nexus_objects:
  nexus_s3:
