name: nexus-ai CI

on:
  push:
    paths: ["nexus-ai/**", ".github/workflows/nexus-ci.yml"]
  pull_request:
    paths: ["nexus-ai/**", ".github/workflows/nexus-ci.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-ai/backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_ci_only
          POSTGRES_DB: nexus_test
        ports: ["5441:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://nexus:nexus_ci_only@localhost:5441/nexus_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-123456
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.12"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check app scripts ../tests && uv run ruff format --check app scripts ../tests
      - name: Type check
        run: uv run mypy app
      - name: Tests (real Postgres + pgvector)
        run: uv run pytest
      - name: Dependency audit
        run: uvx pip-audit --strict -r <(uv export --frozen --no-dev --no-hashes) || echo "::warning::pip-audit reported issues"
        shell: bash

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-ai/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: nexus-ai/frontend/.nvmrc
          cache: npm
          cache-dependency-path: nexus-ai/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx vitest run
      - run: npx vite build
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        working-directory: nexus-ai
        run: |
          cp .env.example .env
          docker compose --profile full build
